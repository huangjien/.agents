# ================================================================= ==
# route.yaml — Intent Routing Rules (skills-first)                   ==
# Single source of truth for intent classification + dispatch        ==
#                                                                    ==
# Skills are the default dispatch target: load the SKILL.md into    ==
# context and execute there. Spawned agents are for isolation only  ==
# (fresh-context verification, broad fan-out search).               ==
#                                                                    ==
# Read by:                                                           ==
#   - OpenCode Major agent (~/.agents/opencode/agent/major.md)       ==
#   - pi / Codex / Gemini / Copilot via ~/AGENTS.md reference        ==
#                                                                    ==
# Edit this file to add routes, change skills, or tune triggers.    ==
# Do NOT retune triggers casually — evals/routing guards them.      ==
# ================================================================= ==

version: 2

# --- Major agent behavior config --------------------------------- --
major_agent:
  name: Major
  description: Universal entry point. Classifies user intent and dispatches — skill load by default, spawn only under spawn conditions.
  default_behavior: classify_then_dispatch

  # Things Major handles itself (DO NOT dispatch)
  handle_directly:
    - greetings           # hi, hello, hey
    - farewells           # bye, thanks
    - identity_queries    # who are you, what can you do
    - clarifications      # asking about a previous response
    - simple_factoids     # one-line factual answers
    - meta_questions      # about route.yaml, skills list, system state
    - status_checks       # what's running, what's done

# --- Spawn registry ----------------------------------------------- --
# The ONLY spawned roles. Each runs in an isolated context and reads
# its `loads` skill on start. Spawn exclusively under rules.spawn_conditions.
spawn_roles:
  - id: researcher
    role: Noisy fan-out research (many files / repos / web pages) in an isolated context; returns a synthesized summary
    loads: research-methods
  - id: reviewer
    role: Fresh-context diff verification — no anchoring on the author's reasoning; returns severity-tagged findings and a verdict
    loads: code-review

# --- Routing rules ------------------------------------------------ --
# Order matters: earlier routes win on tie. Trigger matching:
#   - word-boundary match, case-insensitive (keywords and phrases)
#   - a phrase match beats any keyword match
#   - within a tier, higher priority wins
# Short requests (<10 words) matching no route: question-shaped
# (starts with what/why/how/where/which/who/when or contains "?")
# route to investigation; greetings and identity queries are
# handled directly as smalltalk.
routes:
  - intent: laptop_administration
    description: Manage this laptop, its configuration, installed tools, or agent clients
    triggers:
      keywords: [laptop, macOS, mac, computer, uninstall, configuration,
                 configure, disk, storage]
      phrases:
        - set up my laptop
        - manage my computer
        - configure globally
        - install an agent
        - install an MCP
        - manage agent tools
    dispatch:
      skill: laptop-admin
    priority: 95

  - intent: software_maintenance
    description: Maintain developer software, package managers, CLIs, and runtimes
    triggers:
      keywords: [package, dependency, runtime, toolchain, homebrew, npm,
                 pnpm, pip, rustup, upgrade]
      phrases:
        - update my tools
        - update my CLI
        - upgrade the toolchain
        - install a package
    dispatch:
      skill: software-maintenance
    priority: 92

  - intent: debugging
    description: Something is broken, failing, erroring, or regressing
    triggers:
      keywords: [fix, bug, error, broken, crash, fail, fails, failed,
                 failing, debug, diagnose, regression, traceback, exception,
                 "doesn't work", "not working", stuck, hang, hangs]
      phrases:
        - something is wrong
        - used to work
        - suddenly stopped
        - it broke
    dispatch:
      skill: diagnose
    priority: 90               # higher = wins more ties

  - intent: implementation
    description: Build, write, create, or modify code
    triggers:
      keywords: [implement, build, create, add, write, develop, generate,
                 refactor, modify, update, integrate, wire up, scaffold]
      phrases:
        - I want to add
        - build a feature
        - write a function
        - generate a
        - add support for
        - as default
        - set up
    dispatch:
      skill: karpathy-engineer
    priority: 80

  - intent: review
    description: Audit, check, review for quality or security
    triggers:
      keywords: [review, audit, check, lint, security, vulnerability,
                 quality, inspect, scan, injection]
      phrases:
        - review my code
        - check this for
        - is this secure
        - what can I improve
        - audit
        - look for issues
    dispatch:
      skill: code-review
      spawn: reviewer          # only under spawn_conditions.fresh_verification
    priority: 70

  - intent: architecture
    description: System design, planning, tech decisions, scalability
    triggers:
      keywords: [architecture, design, scalable, scale, system, planning,
                 decide, decision, "should I", strategy, refactor large,
                 restructure, modularize]
      phrases:
        - how should I structure
        - design a system
        - technical decision
        - plan the
        - approach for
    dispatch:
      skill: system-design
    priority: 75

  - intent: testing
    description: Write tests, improve coverage, test strategy
    triggers:
      keywords: [test, tests, coverage, TDD, "unit test", "integration test",
                 "e2e test", fixture, mock, jest, vitest, pytest]
      phrases:
        - add tests
        - write tests
        - test coverage
        - test this
        - increase coverage
    dispatch:
      skill: tdd
    priority: 85              # above implementation: "add tests" is testing,
                              # not a generic code change

  - intent: documentation
    description: Write docs, READMEs, technical prose
    triggers:
      keywords: [document, documentation, README, docstring, docstrings,
                 javadoc, "explain in writing"]
      phrases:
        - write documentation
        - document this
        - update the README
        - add comments
    dispatch:
      skill: doc-templates
    priority: 82              # above implementation: "update the README" is
                              # documentation, not a generic code change

  - intent: investigation
    description: Research, explain, understand, look into
    triggers:
      keywords: [explain, understand, "how does", "why does", "what is",
                 "why is", "how to", investigate, research, explore, find,
                 "look into", "tell me about", analyze, "where is"]
      phrases:
        - I want to understand
        - look into
        - find out
        - where can I find
        - how do I use
    dispatch:
      skill: research-methods
      spawn: researcher        # only under spawn_conditions.fanout_search
    priority: 50

# --- Fallback (no route matched) --------------------------------- --
fallback:
  intent: general
  description: Could not classify confidently
  dispatch:
    skill: research-methods    # safest default: gather info before acting
    spawn: researcher          # only under spawn_conditions.fanout_search
  note: |
    If the request is genuinely ambiguous, ask ONE clarifying question
    before dispatching. Do not ping-pong the user.

# --- Routing meta-rules ------------------------------------------ --
rules:
  - name: skill_first
    description: >
      Default dispatch is a skill load, not a spawn. Read the matched
      skill's SKILL.md into the current context and execute the work
      there. In-context beats spawning because cross-domain context
      helps and spawning duplicates the whole scaffold.

  - name: spawn_conditions
    description: >
      Spawn a role ONLY when one of these holds: (1) fresh_verification —
      independent review of completed work, no anchoring on the author's
      reasoning (spawn reviewer); (2) fanout_search — the work reads many
      files, repos, or web pages and would pollute the main context
      (spawn researcher); (3) explicit_request — the user names a spawn
      role. Everything else stays in-context.

  - name: explicit_over_implicit
    description: >
      If the user names a skill or a spawn role explicitly ("use the
      tdd skill", "ask the reviewer"), honor that choice over keyword
      matching.

  - name: simple_shortcut
    description: >
      Requests under ~10 words that match no route: if question-shaped
      (starts with what/why/how/where/which/who/when, or contains a
      question mark) route to investigation. Greetings and identity
      queries are handled directly. Other short unmatched requests
      are likely simple — handle directly.

  - name: announce_dispatch
    description: >
      Never dispatch silently. Announce "Loading skill {skill} because
      {reason}" or, when spawning, "Spawning {role} because {condition}".

  - name: spawn_cost
    description: >
      A spawned role re-pays the full scaffold (system prompt + tools)
      and returns only a summary. Prefer in-context skill work unless a
      spawn condition holds.

  - name: synthesize_on_spawn
    description: >
      When a spawned role returns, synthesize its output into a single
      coherent response. Do not paste raw spawned output verbatim.
